spring:
  application:
    name: maid-booking

server:
  port: 8080

app:
  time-zone: Asia/Kolkata
  travel:
    same-zone-minutes: 15
    neighbour-zone-minutes: 30
  idempotency:
    ttl-hours: 24
  shift:
    early-check-in-minutes: 30
  capacity:
    utilisation-factor: 0.85
    hold-sweep-interval-ms: 60000
  booking:
    min-lead-minutes: 120
    max-advance-days: 30
    hold-minutes: 10
  subscription:
    generation-cron: "0 30 0 * * *"
  recurring:
    charge-hours-before: 24
    charge-interval-ms: 900000
  cancellation:
    policy: time-based
    full-refund-hours: 4
    partial-refund-hours: 1
    partial-refund-percent: 50
  instant:
    promise-minutes: 15
  allocation:
    weights:
      best-fit-gap: 1.0
      preferred-maid: 10.0
      travel-distance: 1.0
      fairness: 0.5
      rating: 0.5
  pricing:
    hourly-rates:
      CLEANING: 249
      COOKING: 299
      DISHWASHING: 199
      LAUNDRY: 199
      BABYSITTING: 349
    tier-multipliers:
      STANDARD: 1.0
      PREMIUM: 1.3

management:
  endpoints:
    web:
      exposure:
        include: health,info
