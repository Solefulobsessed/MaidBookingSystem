spring:
  application:
    name: maid-booking

server:
  port: 8080

app:
  time-zone: Asia/Kolkata
  travel:
    same-zone-minutes: 15
    neighbour-zone-minutes: 30
  idempotency:
    ttl-hours: 24
  shift:
    early-check-in-minutes: 30
  capacity:
    utilisation-factor: 0.85
    hold-sweep-interval-ms: 60000

management:
  endpoints:
    web:
      exposure:
        include: health,info
